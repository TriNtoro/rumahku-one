<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e9">
<meta name="color-scheme" content="light dark">
<title>RUMAHKU-ONE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f1e9;--card:#fffdf9;--ink:#2a2723;--mute:#7a7268;--line:#ece4d8;--acc:#2f5d4e;--acc-ink:#fff;--soft:#e4ede7;--warn:#a8710f;--warnbg:#f6e7bf;--bad:#b4412f;--badbg:#f6d9d1;--ok:#2f7d4f;--r:20px;--sh:0 1px 2px rgba(60,40,10,.05),0 6px 18px rgba(60,40,10,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#161411;--card:#201d19;--ink:#f1ebe2;--mute:#a79e91;--line:#332e27;--acc:#86c9ab;--acc-ink:#0c2218;--soft:#22302a;--warn:#e7b54d;--warnbg:#3a2f12;--bad:#f08a76;--badbg:#3d211b;--ok:#6fd195;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
header#top{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 0 8px;min-height:64px}
header#top .tt{flex:1;min-width:0}
header#top h1{margin:0;font-size:1.55rem;line-height:1.2;letter-spacing:-.01em}
header#top p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.bk{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1;padding:0 0 3px;box-shadow:var(--sh)}
h2{font-size:.78rem;margin:22px 4px 8px;color:var(--mute);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.pad{padding:16px}
.card.hero{background:linear-gradient(135deg,var(--acc),#4b806c);color:var(--acc-ink);border:0}
@media (prefers-color-scheme:dark){.card.hero{background:linear-gradient(135deg,#25473a,#2f5d4e);color:#e8f5ee}}
.hero .mute,.hero .s{color:inherit;opacity:.8}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row .grow,.grow{flex:1;min-width:0}
.t{overflow-wrap:anywhere;font-weight:600}
.s{color:var(--mute);font-size:.84rem}
.row.done .t{text-decoration:line-through;color:var(--mute);font-weight:500}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:rgba(196,150,90,.2)}
.ic.c2{background:rgba(70,140,100,.2)}.ic.c3{background:rgba(194,105,63,.2)}.ic.c4{background:rgba(80,120,180,.2)}.ic.c5{background:rgba(190,90,130,.2)}.ic.c6{background:rgba(210,170,40,.24)}
.chev{color:var(--mute);font-size:1.3rem;flex:none}
.bd{font-size:.76rem;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--soft);color:var(--acc);white-space:nowrap;flex:none}
.bd.soon{background:var(--warnbg);color:var(--warn)}.bd.late{background:var(--badbg);color:var(--bad)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);background:transparent;flex:none;padding:0;cursor:pointer;display:grid;place-items:center;color:var(--acc-ink);font-size:15px}
.chk.on{background:var(--acc);border-color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:14px;padding:12px 18px;font-weight:700;min-height:46px}
.btn.alt{background:var(--soft);color:var(--acc)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 14px;min-height:38px;font-size:.9rem;border-radius:12px}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--acc);padding:6px;font-weight:700;min-height:36px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;color:var(--mute);white-space:nowrap;min-height:40px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--sh)}
.big{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mute{color:var(--mute)}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar i.warn{background:#d19a2a}.bar i.over{background:var(--bad)}
.empty{color:var(--mute);padding:18px 2px;font-size:.95rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.grid .h{font-size:.75rem;color:var(--mute);padding:4px 0;font-weight:700}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:5px 0;position:relative}
.day.sel{outline:2px solid var(--acc)}
.day.today{font-weight:800;color:var(--acc)}
.day.off{visibility:hidden}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:2px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.day .dots i.t{background:#d19a2a}.day .dots i.b{background:#d4608a}.day .dots i.o{background:#c2693f}.lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}.lg i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}.lg i.t{background:#d19a2a}.lg i.b{background:#d4608a}.lg i.o{background:#c2693f}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 10px 16px;text-align:center;box-shadow:var(--sh);min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700}
.tile .em{font-size:1.9rem;line-height:1}
.tile .n{position:absolute;top:10px;right:12px;min-width:22px;height:22px;border-radius:99px;background:var(--bad);color:#fff;font-size:.75rem;display:grid;place-items:center;padding:0 6px}
.tile .n.soft{background:var(--soft);color:var(--acc)}
.tile small{font-weight:500;color:var(--mute);font-size:.76rem}
.pc{padding:12px 16px}
.pc .pt{display:flex;align-items:center;gap:12px}
.pc .pa{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.pc.late{border-color:var(--bad)}
.qb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.2rem;font-weight:700;color:var(--acc);padding:0}
.qty{min-width:56px;text-align:center;font-weight:800}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav#nav button{flex:1;max-width:120px;background:none;border:0;border-radius:16px;padding:7px 2px 6px;color:var(--mute);font-size:.7rem;min-height:56px;font-weight:600}
nav#nav button b{display:block;font-size:1.3rem;font-weight:400;line-height:1.25}
nav#nav button.on{background:var(--soft);color:var(--acc);font-weight:800}
#fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6;padding:0 0 3px}
dialog{border:0;border-radius:24px;padding:0;width:min(520px,calc(100vw - 20px));max-height:92vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,12,0,.5)}
dialog form,dialog .menu{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-size:1.15rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute);font-weight:600}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1rem;color:var(--ink);min-height:46px;width:100%;font-weight:400}
label.f.c{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:1rem;font-weight:500}
label.f.c input{width:22px;min-height:22px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.menu button{text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#2a2723;color:#fff;padding:11px 18px;border-radius:14px;z-index:20;max-width:90vw;display:none;font-size:.92rem}
.inl{display:flex;gap:8px;margin-bottom:12px}
.inl input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:1rem;min-height:46px}
.note{font-size:.82rem;color:var(--mute);margin:8px 4px}
.tag{display:inline-block;font-size:.72rem;border-radius:99px;padding:1px 9px;background:var(--soft);color:var(--acc);margin-left:6px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--mute);white-space:nowrap}.kv span:last-child{text-align:right}
.hr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:56px;cursor:pointer}.hr:last-child{border:0}

.av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;background:var(--soft);color:var(--acc);font-weight:800;font-size:1.1rem}.av.lg{width:64px;height:64px;font-size:1.6rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 16px;font-weight:700;min-height:40px}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.rt .rn{font-size:1.25rem;text-align:right;white-space:nowrap}.rt .rn small{display:block;font-size:.7rem;color:var(--mute);font-weight:500}.rt.off{opacity:.6}
.bar i.warn{background:#d19a2a}.idn{letter-spacing:.02em;font-size:.95rem;font-variant-numeric:tabular-nums;word-break:break-all}
.cc{background:linear-gradient(160deg,#e9a77c,#d98a5f);border-radius:22px;padding:10px;margin:4px 0 14px;box-shadow:var(--sh)}.cc-in{border:2px solid #1f3d33;border-radius:16px;min-height:210px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:#f7ecd9;color:#1f3d33}.cc-in small{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;opacity:.7}.cc-in p{margin:0;font-size:1.2rem;line-height:1.45;font-weight:700}
.draft p{white-space:pre-wrap}
.hlp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--sh)}.hlp summary{padding:16px;font-weight:700;cursor:pointer;min-height:52px;list-style:none}.hlp summary::-webkit-details-marker{display:none}.hlp .hb{padding:0 16px 16px;line-height:1.55}.hlp ol{padding-left:20px;margin:6px 0}.hlp li{margin-bottom:6px}.hlp code{background:var(--soft);padding:2px 6px;border-radius:6px;word-break:break-all}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:2px}
.pb{position:relative;height:9px;border-radius:9px;background:var(--line);margin:10px 0 6px}
.pb i{display:block;height:100%;background:var(--acc);border-radius:9px}.pb i.warn{background:#d19a2a}.pb i.over{background:var(--bad)}
.pb .pm{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{display:flex;gap:5px;margin:8px 0}.lv i{flex:1;height:9px;border-radius:5px;background:var(--line)}
.lv i.on{background:var(--acc)}.lv i.on.l0,.lv i.on.l1{background:var(--bad)}.lv i.on.l2{background:#d19a2a}
.cz{cursor:pointer}
.kv b{white-space:nowrap}
.seg button{padding-left:8px;padding-right:8px;font-size:.88rem}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main" aria-live="polite"></main>
</div>
<button id="fab" data-a="quick" aria-label="Tambah cepat">+</button>
<nav id="nav" aria-label="Menu utama">
  <button data-a="tab" data-v="today"><b>🏠</b>Beranda</button>
  <button data-a="tab" data-v="rumah"><b>🛠️</b>Rumah</button>
  <button data-a="tab" data-v="money"><b>💰</b>Uang</button>
  <button data-a="tab" data-v="cal"><b>📅</b>Kalender</button>
  <button data-a="tab" data-v="more"><b>☰</b>Lainnya</button>
</nav>
<dialog id="dlg" aria-modal="true"></dialog>
<div id="toast" role="status"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
